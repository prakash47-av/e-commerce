<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Couples Dress</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">

  <div class="container">

    <a class="navbar-brand fw-bold" href="#">
      Zoro
    </a>

    <button class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarContent">

      <span class="navbar-toggler-icon"></span>

    </button>

    <div class="collapse navbar-collapse" id="navbarContent">

      <form class="d-flex mx-auto w-50">

        <input class="form-control"
          type="search"
          placeholder="Search products...">

      </form>

      <div class="mt-2 mt-lg-0">

        <button class="btn btn-outline-light me-2">
          Login
        </button>

        <button class="btn btn-warning me-2">
          Signup
        </button>

        <a href=""
          class="btn btn-light position-relative">

          🛒 Cart

        </a>

      </div>

    </div>

  </div>

</nav>


<!-- MENU -->

<div class="bg-white shadow-sm">

  <div class="container py-2 d-flex justify-content-center gap-4 flex-wrap">

    <a href="#" class="nav-link">
      Home
    </a>

    <a href="#" class="nav-link">
      Saree
    </a>

    <a href="#" class="nav-link">
      Shoes
    </a>

    <a href="#" class="nav-link fw-bold text-dark">
      Couples Dress
    </a>

    <a href="#" class="nav-link">
      Watch
    </a>

  </div>

</div>



<!-- MAIN -->

<div class="container my-4">

  <h1 class="fw-bold">
    Couples Dress
  </h1>

  <p class="text-secondary">
    Showing products
  </p>

  <div class="row">

    <!-- FILTER -->

    <div class="col-lg-3 mb-4">

      <div class="card shadow-sm">

        <div class="card-body">

          <h4 class="mb-4">
            FILTERS
          </h4>

          <!-- CATEGORY -->

          <div class="border-top pt-3">

            <div class="d-flex justify-content-between">

              <h5>Category</h5>

              <i class="bi bi-chevron-down"></i>

            </div>

            <div class="form-check mt-3">

              <input class="form-check-input" type="checkbox">

              <label class="form-check-label">
                Couples Dress
              </label>

            </div>

          </div>

          <!-- COLOR -->

          <div class="border-top pt-3 mt-4">

            <div class="d-flex justify-content-between">

              <h5>Color</h5>

              <i class="bi bi-chevron-down"></i>

            </div>

            <!-- RED -->

            <div class="form-check mt-3">

              <input class="form-check-input color-filter"
                type="checkbox"
                value="red"
                id="redColor">

              <label class="form-check-label" for="redColor">
                Red
              </label>

            </div>

            <!-- BLACK -->

            <div class="form-check">

              <input class="form-check-input color-filter"
                type="checkbox"
                value="black"
                id="blackColor">

              <label class="form-check-label" for="blackColor">
                Black
              </label>

            </div>

            <!-- WHITE -->

            <div class="form-check">

              <input class="form-check-input color-filter"
                type="checkbox"
                value="white"
                id="whiteColor">

              <label class="form-check-label" for="whiteColor">
                White
              </label>

            </div>

          </div>

        </div>

      </div>

    </div>



    <!-- PRODUCTS -->

    <div class="col-lg-9">

      <div class="row g-4">

        <!-- RED PRODUCT -->

        <div class="col-md-4 product-card" data-color="red">

          <div class="card h-100 shadow-sm">

            <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?q=80&w=800&auto=format&fit=crop"
              class="card-img-top"
              height="300"
              style="object-fit: cover;">

            <div class="card-body text-center">

              <h5>Red Couples Dress</h5>

              <p class="fw-bold text-danger">
                ₹999
              </p>

            </div>

          </div>

        </div>

        


        <!-- BLACK PRODUCT -->

        <div class="col-md-4 product-card" data-color="black">

          <div class="card h-100 shadow-sm">

            <img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?q=80&w=800&auto=format&fit=crop"
              class="card-img-top"
              height="300"
              style="object-fit: cover;">

            <div class="card-body text-center">

              <h5>Black Couples Dress</h5>

              <p class="fw-bold text-dark">
                ₹1299
              </p>

            </div>

          </div>

        </div>



        <!-- WHITE PRODUCT -->

        <div class="col-md-4 product-card" data-color="white">

          <div class="card h-100 shadow-sm">

            <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=800&auto=format&fit=crop"
              class="card-img-top"
              height="300"
              style="object-fit: cover;">

            <div class="card-body text-center">

              <h5>White Couples Dress</h5>

              <p class="fw-bold text-secondary">
                ₹1499
              </p>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>



<!-- JAVASCRIPT -->

<script>

const filters = document.querySelectorAll(".color-filter");

const products = document.querySelectorAll(".product-card");


filters.forEach(filter => {

  filter.addEventListener("change", () => {

    let selectedColors = [];

    filters.forEach(f => {

      if (f.checked) {

        selectedColors.push(f.value);

      }

    });



    products.forEach(product => {

      const productColor = product.getAttribute("data-color");



      if (

        selectedColors.length === 0 ||

        selectedColors.includes(productColor)

      ) {

        product.style.display = "block";

      }

      else {

        product.style.display = "none";

      }

    });

  });

});

</script>



<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
