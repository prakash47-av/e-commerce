<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart</title>
 <link rel="icon" type="image/png" href="./logo3.png">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow">
<div class="container">
<a href="index.html" class="navbar-brand fw-bold fs-3 text-warning">
TRENDORA
</a>
</div>
</nav>

<div class="container my-5">

<h1 class="fw-bold mb-4">Shopping Cart</h1>

<div id="cart-items"></div>

<div class="card p-4 shadow rounded-4 mt-4">

<h3>Total: ₹<span id="total">0</span></h3>

<div class="d-flex gap-3 mt-3">

<button class="btn btn-dark rounded-pill">
Proceed To Checkout
</button>

<button class="btn btn-danger rounded-pill" onclick="clearCart()">
Clear Cart
</button>

</div>

</div>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartItems = document.getElementById("cart-items");
const totalElement = document.getElementById("total");

function displayCart() {

  cartItems.innerHTML = "";
  let total = 0;

  if(cart.length === 0){
    cartItems.innerHTML = `
      <div class="alert alert-warning text-center rounded-4">
        Cart is Empty
      </div>
    `;
  }

  cart.forEach(item => {

    total += item.price;

    cartItems.innerHTML += `

    <div class="card mb-3 shadow-sm rounded-4">

      <div class="row g-0 align-items-center">

        <div class="col-md-3">
          <img src="${item.image}" class="img-fluid rounded-start"
          style="height:200px; width:100%; object-fit:cover;">
        </div>

        <div class="col-md-9">

          <div class="card-body">

            <h4>${item.name}</h4>

            <h5 class="text-danger">₹${item.price}</h5>

          </div>

        </div>

      </div>

    </div>

    `;
  });

  totalElement.innerText = total;
}

function clearCart() {

  localStorage.removeItem("cart");

  cart = [];

  displayCart();

}

displayCart();

</script>

</body>
</html>
